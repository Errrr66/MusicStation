server:
  port: ${SERVER_PORT:8080}

spring:
  # 配置数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/vibe_music?useUnicode=true&characterEncoding=utf-8&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource # 配置连接池

  # Redis服务连接配置
  data:
    redis:
      database: 1
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 100MB # 设置最大上传文件大小为100MB
      max-request-size: 100MB # 设置最大请求大小为100MB

  # 对于注解的Redis缓存数据统一设置有效期为10分钟，单位毫秒
  cache:
    redis:
      time-to-live: 600000

  # 配置邮件服务
  mail:
    # 配置邮箱账户和密码
    host: smtp.qq.com # 修改你的 SMTP 服务器地址
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          # 邮件服务超时时间配置
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  ai:
    openai:
          api-key: ${DEEPSEEK_API_KEY:sk-576b0d5ae1d34c5db797d9e530381768}
          base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
          chat:
            options:
              model: ${AI_CHAT_MODEL:deepseek-v4-flash}
              temperature: ${AI_CHAT_TEMPERATURE:0.7}
              max-tokens: ${AI_CHAT_MAX_TOKENS:2048}
              top-p: ${AI_CHAT_TOP_P:1.0}
            completions-path: /chat/completions
          embedding:
            options:
              model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
            embeddings-path: /embeddings

# DeepSeek API Configuration（保留兼容旧 DeepSeekService）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-576b0d5ae1d34c5db797d9e530381768}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: deepseek-v4-flash

# Spring AI 配置（OpenAI 兼容协议，指向阿里云 DashScope）

# 统一 AI 服务配置
ai:
  service:
    # 默认 Provider：openai-compatible（DashScope 兼容）
    default-provider: ${AI_DEFAULT_PROVIDER:openai-compatible}
    # 请求超时（秒）
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT:10}
    read-timeout-seconds: ${AI_READ_TIMEOUT:60}
    # 重试配置
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      backoff-millis: ${AI_RETRY_BACKOFF_MILLIS:1000}
    # 熔断配置
    circuit-breaker:
      failure-rate-threshold: ${AI_CB_FAILURE_RATE:0.5}
      slow-call-rate-threshold: ${AI_CB_SLOW_CALL_RATE:0.5}
      slow-call-duration-threshold-seconds: ${AI_CB_SLOW_CALL_SECONDS:30}
      wait-duration-seconds: ${AI_CB_WAIT_SECONDS:60}
      sliding-window-size: ${AI_CB_WINDOW_SIZE:10}
    # 降级响应
    fallback:
      enabled: ${AI_FALLBACK_ENABLED:true}
      message: "AI 服务暂时不可用，请稍后重试"
    # 全链路日志
    logging:
      enabled: ${AI_LOGGING_ENABLED:true}
      log-request-body: ${AI_LOG_REQUEST_BODY:true}
      log-response-body: ${AI_LOG_RESPONSE_BODY:false}
  # Spring AI RAG 配置（阶段7：基于 EmbeddingModel + SimpleVectorStore 的语义检索）
  rag:
    # 是否在启动时自动索引歌曲/歌手到向量库
    auto-index: ${AI_RAG_AUTO_INDEX:false}
    # 单批写入向量库的文档块数量
    index-batch-size: ${AI_RAG_INDEX_BATCH_SIZE:100}
    # 文档分块字符长度
    chunk-size: ${AI_RAG_CHUNK_SIZE:500}
    # 相邻分块重叠字符数
    chunk-overlap: ${AI_RAG_CHUNK_OVERLAP:100}
    # 检索返回 topK
    top-k: ${AI_RAG_TOP_K:4}

# 真流式 SSE 端点开关（阶段6：/chat/agent/stream/v2）
chat:
  stream:
    v2:
      enabled: ${CHAT_STREAM_V2_ENABLED:true}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:wOZR8iLf7tNqXpKvYhJkLmNoPqRsTuVwXyZ0123456789ABCDEF}

# CORS 配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

tts:
  api-url: ${TTS_API_URL:http://127.0.0.1:5000/voice}

shazam:
  api-url: ${SHAZAM_API_URL:http://127.0.0.1:8000/recognize}

agent:
  search:
    connect-timeout-seconds: 3
    request-timeout-seconds: 5
    cache-ttl-seconds: 900
    circuit-breaker-fail-threshold: 3
    circuit-breaker-open-seconds: 120
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
    top-k: ${AGENT_RAG_TOP_K:4}
    max-snippet-length: ${AGENT_RAG_MAX_SNIPPET_LENGTH:120}
    mode: ${AGENT_RAG_MODE:hybrid}
    keyword-weight: ${AGENT_RAG_KEYWORD_WEIGHT:0.45}
    vector-weight: ${AGENT_RAG_VECTOR_WEIGHT:0.55}
    semantic-weight: ${AGENT_RAG_SEMANTIC_WEIGHT:0.35}
    candidate-multiplier: ${AGENT_RAG_CANDIDATE_MULTIPLIER:3}
    rerank:
      enabled: ${AGENT_RAG_RERANK_ENABLED:true}
      weight: ${AGENT_RAG_RERANK_WEIGHT:0.25}
    semantic:
      enabled: ${AGENT_RAG_SEMANTIC_ENABLED:false}
      api-url: ${AGENT_RAG_SEMANTIC_API_URL:}
      api-key: ${AGENT_RAG_SEMANTIC_API_KEY:}
      model: ${AGENT_RAG_SEMANTIC_MODEL:text-embedding-v3}
      max-text-length: ${AGENT_RAG_SEMANTIC_MAX_TEXT_LENGTH:1000}
  artist-alias:
    enabled: ${AGENT_ARTIST_ALIAS_ENABLED:true}
    refresh-on-startup: ${AGENT_ARTIST_ALIAS_REFRESH_ON_STARTUP:true}
    redis-key: ${AGENT_ARTIST_ALIAS_REDIS_KEY:agent:artist:alias:index:v1}
    redis-ttl-seconds: ${AGENT_ARTIST_ALIAS_REDIS_TTL_SECONDS:43200}
    # Format: alias=canonicalArtistName,alias2=canonicalArtistName2
    override-mappings: ${AGENT_ARTIST_ALIAS_OVERRIDE_MAPPINGS:}

# 配置 mybatis-plus
mybatis-plus:
  type-aliases-package:   com.example.music.model.entity # 实体类所在的包，允许用实体类类名作为别名

  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 配置日志
    map-underscore-to-camel-case: true # 类属性与表字段的驼峰映射

  global-config:
    db-config: # 数据库配置
      table-prefix: tb_  # 表名前缀为tb_，表名为前缀连接类名（小写）

# 定义角色和路径权限的映射关系
role-path-permissions:
  permissions:
    ROLE_ADMIN:
      - "/admin/"
    ROLE_USER:
      - "/user/"
      - "/playlist/"
      - "/artist/"
      - "/song/"
      - "/favorite/"
      - "/chat/"
      - "/social/"
      - "/search/"
      - "/comment/"
      - "/banner/"
      - "/feedback/"

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESSKEY:minioadmin}
  secretKey: ${MINIO_SECRETKEY:minioadmin}
  bucket: ${MINIO_BUCKET:vibe-music-data}


# 确保已经安装并启动了 MySQL 数据库。
